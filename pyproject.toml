[project]
name = "xm-contract-approve"
version = "0.1.0"
description = "企业合同审批智能审查系统 —— 文档解析 + 规则/LLM 双引擎审查 + 原文定位 + 审批回写"
requires-python = ">=3.12"
dependencies = [
    # --- Web 层 ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # --- 配置与校验 ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7",
    # --- 数据层 ---
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.9",
    "aiosqlite>=0.20",
    "greenlet>=3.1",
    # --- 文档解析 ---
    "python-docx>=1.1.2",
    "pymupdf>=1.24.14",
    "pillow>=11.0",
    # --- LLM（OpenAI 兼容）---
    "openai>=1.57",
    "httpx>=0.27",
    # --- 报告导出 ---
    "markdown>=3.7",
    "reportlab>=4.2.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# 扫描件 OCR。onnxruntime 版比 paddle 轻得多（约 100MB vs 2GB+），适合 16G 内存机器
ocr = ["rapidocr-onnxruntime>=1.3.24"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

# uv 默认从清华镜像拉包，避免国内网络超时
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
